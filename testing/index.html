    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DL Pamphlets</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;

            box-shadow: 0 0 15px 5px rgba(94, 108, 112, 0.93);
            box-sizing: border-box;
        }
    </style>
</head>
